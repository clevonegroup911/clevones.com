name: X100 CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: x100-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://ci_user:ci_pass@127.0.0.1:5432/ci_x100?schema=public
  APP_ORIGIN: http://localhost:3000
  AUTH_SECRET: ci-only-auth-secret-not-for-production-use
  MFA_ENCRYPTION_KEY: eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg=
  MFA_ISSUER: CLEVONES-CI
  CI: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prepare artifact directory
        run: mkdir -p ci-artifact/logs && printf '%s\n' '{"steps":[]}' > ci-artifact/results.json

      - name: Fetch main for diff check
        continue-on-error: true
        run: git fetch --no-tags origin main

      - name: Validate Prisma schema
        continue-on-error: true
        run: node scripts/ci-step.mjs prisma_validate -- npx prisma validate

      - name: Validate backlog
        continue-on-error: true
        run: node scripts/ci-step.mjs backlog -- npm run x100:validate-backlog

      - name: Run X100 tests
        continue-on-error: true
        run: node scripts/ci-step.mjs x100_tests -- npm run x100:test

      - name: Validate task report
        continue-on-error: true
        run: node scripts/ci-step.mjs task_report -- npm run x100:validate-report

      - name: Run application tests
        continue-on-error: true
        run: node scripts/ci-step.mjs tests -- npm test

      - name: Lint
        continue-on-error: true
        run: node scripts/ci-step.mjs lint -- npm run lint

      - name: Type-check
        continue-on-error: true
        run: node scripts/ci-step.mjs typecheck -- npx tsc --noEmit

      - name: Build
        continue-on-error: true
        run: node scripts/ci-step.mjs build -- npm run build

      - name: Check conflict markers and whitespace
        continue-on-error: true
        run: node scripts/ci-step.mjs diff_check -- node scripts/ci-diff-check.mjs

      - name: Security audit
        continue-on-error: true
        run: node scripts/ci-step.mjs audit -- node scripts/ci-audit.mjs

      - name: Collect artifact
        if: always()
        run: node scripts/ci-gate.mjs
        continue-on-error: true

      - name: Upload X100 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x100-ci
          path: ci-artifact/
          if-no-files-found: warn

      - name: Fail if quality checks failed
        if: always()
        run: node scripts/ci-gate.mjs

  comment:
    name: x100-ci-comment
    needs: quality
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download X100 artifact
        uses: actions/download-artifact@v4
        with:
          name: x100-ci
          path: ci-artifact

      - name: Publish [X100-CI] comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          X100_ARTIFACT_DIR: ci-artifact
        run: node scripts/ci-pr-comment.mjs
