<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-label="Clevones  Governance Architecture for Territorial Economic Flows">
  <title>Clevones  Governance Architecture for Territorial Economic Flows</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0d12"/>
      <stop offset="45%" stop-color="#121820"/>
      <stop offset="100%" stop-color="#1a2b48"/>
    </linearGradient>

    <pattern id="grid-fine" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#c9a84c" stroke-opacity="0.07" stroke-width="0.5"/>
    </pattern>

    <pattern id="grid-major" width="192" height="192" patternUnits="userSpaceOnUse">
      <rect width="192" height="192" fill="url(#grid-fine)"/>
      <path d="M192 0H0V192" stroke="#d4a017" stroke-opacity="0.1" stroke-width="1"/>
    </pattern>

    <radialGradient id="vignette" cx="50%" cy="42%" r="68%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="72%" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.42"/>
    </radialGradient>

    <linearGradient id="gold-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4a017" stop-opacity="0"/>
      <stop offset="18%" stop-color="#d4a017"/>
      <stop offset="82%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Territorial grid -->
  <rect width="1200" height="630" fill="url(#grid-major)"/>

  <!-- Meridian emphasis -->
  <g stroke="#d4a017" stroke-opacity="0.08" stroke-width="1">
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Latitude curves -->
  <g fill="none" stroke="#6b7d96" stroke-opacity="0.12" stroke-width="1">
    <path d="M0 210 Q600 188 1200 210"/>
    <path d="M0 315 Q600 336 1200 315"/>
    <path d="M0 420 Q600 398 1200 420"/>
  </g>

  <!-- Corner framing -->
  <g stroke="#d4a017" stroke-opacity="0.22" stroke-width="1">
    <path d="M48 88V48H88"/>
    <path d="M1112 88V48H1072"/>
    <path d="M48 542V582H88"/>
    <path d="M1112 542V582H1072"/>
  </g>

  <!-- Vignette -->
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- Brand block -->
  <g transform="translate(600 300)">
    <!-- Gold accent line -->
    <rect x="-56" y="-92" width="112" height="2" fill="url(#gold-line)" filter="url(#soft-glow)"/>

    <!-- Wordmark -->
    <text
      x="0"
      y="8"
      text-anchor="middle"
      fill="#f1f5f9"
      font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
      font-size="72"
      font-weight="600"
      letter-spacing="-1.5"
    >Clevones</text>

    <!-- Tagline -->
    <text
      x="0"
      y="58"
      text-anchor="middle"
      fill="#94a3b8"
      font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
      font-size="21"
      font-weight="400"
      letter-spacing="0.2"
    >Governance Architecture for Territorial Economic Flows</text>
  </g>

  <!-- Bottom institutional mark -->
  <text
    x="600"
    y="578"
    text-anchor="middle"
    fill="#6b7d96"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="11"
    font-weight="500"
    letter-spacing="3.2"
  >CLEVONES.COM</text>
</svg>
